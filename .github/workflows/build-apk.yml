name: Build Face AI APK

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: face-ai-android-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project Files
        run: |
          flutter create --project-name face_ai --platforms=android --org com.esame.faceai scaffold
          cp -R scaffold/android ./android
          # file_picker's Android lifecycle dependency now requires compileSdk 36+.
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")
          content = gradle.read_text()
          if gradle.name.endswith(".kts"):
              content, count = re.subn(
                  r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|[0-9]+)',
                  'compileSdk = 36',
                  content,
                  count=1,
              )
          else:
              content, count = re.subn(
                  r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|[0-9]+)',
                  'compileSdkVersion 36',
                  content,
                  count=1,
              )
          if count != 1:
              raise SystemExit(f"Could not set compileSdk 36 in {gradle}")
          gradle.write_text(content)
          print(f"Configured {gradle} to compile against Android API 36")
          PY
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />' + chr(10) + chr(10) + '    <application',
                  1,
              )
          if "android:usesCleartextTraffic" not in content:
              content = content.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          import re
          content = re.sub(
              r'<application\b([^>]*)>',
              lambda match: '<application' + re.sub(
                  r'\s+android:label="[^"]*"',
                  '',
                  match.group(1),
              ) + ' android:label="المحترف في AI">',
              content,
              count=1,
          )
          manifest.write_text(content)
          PY

      - name: Get Dependencies
        run: flutter pub get

      - name: Patch Android plugin compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          patterns = [
              (re.compile(r'(compileSdk\\s*=\\s*)(?:flutter\\.compileSdkVersion|[0-9]+)'), r'\\g<1>36'),
              (re.compile(r'(compileSdkVersion\\s+)(?:flutter\\.compileSdkVersion|[0-9]+)'), r'\\g<1>36'),
          ]
          changed = []
          for gradle in root.glob("*/android/build.gradle*"):
              content = gradle.read_text(errors="ignore")
              original = content
              for pattern, replacement in patterns:
                  content = pattern.sub(replacement, content)
              if content != original:
                  gradle.write_text(content)
                  changed.append(str(gradle))
          print("Patched Android plugin Gradle files:")
          print("\\n".join(changed) if changed else "No plugin Gradle files needed changes")
          if not any("file_picker-" in item for item in changed):
              print("NOTE: file_picker was not modified; inspect its resolved Gradle file if build fails.")
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Face-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
