name: FaceFusion Docker Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/Dockerfile"
      - "backend/engine.py"
      - ".github/workflows/facefusion-docker.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: mohtarif-face-ai:ci
          load: true
          cache-from: type=gha,scope=facefusion-cpu
          cache-to: type=gha,mode=max,scope=facefusion-cpu

      - name: Verify FaceFusion installation and CLI
        run: |
          docker run --rm --entrypoint python mohtarif-face-ai:ci /opt/facefusion/facefusion.py --help
          docker run --rm --entrypoint python mohtarif-face-ai:ci /opt/facefusion/facefusion.py headless-run --help

      - name: Run real CPU face-swap inference
        timeout-minutes: 25
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/facefusion-test"
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/opencv/opencv/master/samples/data/lena.jpg \
            -o "$RUNNER_TEMP/facefusion-test/source.jpg"
          cp "$RUNNER_TEMP/facefusion-test/source.jpg" "$RUNNER_TEMP/facefusion-test/target.jpg"
          docker run --rm \
            -v "$RUNNER_TEMP/facefusion-test:/test-data" \
            --entrypoint python \
            mohtarif-face-ai:ci \
            /opt/facefusion/facefusion.py headless-run \
              --source-paths /test-data/source.jpg \
              --target-path /test-data/target.jpg \
              --output-path /test-data/swapped.png \
              --processors face_swapper
          test -s "$RUNNER_TEMP/facefusion-test/swapped.png"
          docker run --rm \
            -v "$RUNNER_TEMP/facefusion-test:/test-data" \
            --entrypoint python \
            mohtarif-face-ai:ci \
            -c "from PIL import Image; im=Image.open('/test-data/swapped.png'); im.verify(); print('REAL INFERENCE OUTPUT:', im.format, im.size)"
