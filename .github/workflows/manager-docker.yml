name: Manager Docker Build Check

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/manager-docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/manager-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build lightweight manager image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.manager
          push: false
          load: true
          tags: face-ai-manager:test

      - name: Run manager API and real FFmpeg voice conversion
        run: |
          set -euo pipefail
          docker run -d --name face-ai-manager -p 8000:8000 -e API_KEY=ci-audio-test-secret face-ai-manager:test
          trap 'docker rm -f face-ai-manager >/dev/null 2>&1 || true' EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then healthy=true; break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then docker logs face-ai-manager; exit 1; fi
          python - <<'PY'
          import wave
          with wave.open("$RUNNER_TEMP/input.wav", "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(48000)
              audio.writeframes(b"".join(
                  int(5000 * __import__("math").sin(2 * __import__("math").pi * 440 * i / 48000)).to_bytes(2, "little", signed=True)
                  for i in range(96000)
              ))
          PY
          curl -fsS -X POST http://127.0.0.1:8000/api/change-voice \
            -H "Authorization: Bearer ci-audio-test-secret" \
            -F "voice_type=امرأة" -F "audio=@$RUNNER_TEMP/input.wav" \
            -o "$RUNNER_TEMP/changed.mp3"
          python - <<'PY'
          from pathlib import Path
          data = Path("$RUNNER_TEMP/changed.mp3").read_bytes()
          assert data.startswith(b"ID3") or data[:1] == b"\xff", "Output is not a valid MP3 stream"
          print("Verified MP3 output bytes:", len(data))
          PY
