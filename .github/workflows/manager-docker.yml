name: Manager Docker Build Check

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/manager-docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/manager-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build lightweight manager image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.manager
          push: false
          tags: face-ai-manager:test
