name: Build Face AI APK

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: face-ai-android-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project Files
        run: |
          flutter create --project-name face_ai --platforms=android --org com.esame.faceai scaffold
          cp -R scaffold/android ./android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />' + chr(10) + chr(10) + '    <application',
                  1,
              )
          if "android:usesCleartextTraffic" not in content:
              content = content.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          import re
          content = re.sub(
              r'<application\\b([^>]*)>',
              lambda match: '<application' + re.sub(
                  r'\\s+android:label="[^"]*"',
                  '',
                  match.group(1),
              ) + ' android:label="المحترف في AI">',
              content,
              count=1,
          )
          manifest.write_text(content)
          PY

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Face-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
